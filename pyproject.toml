[project]
name = "code-rag"
version = "0.2.0"
description = "CodeHound Intel Edition — code semantic search MCP server for Intel Mac"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.2.4",
    "fastembed>=0.4.0",
    "flashrank>=0.2.10",
    "llama-index-core>=0.14",
    "numpy<2.0",
    "onnxruntime==1.17.3",
    "pathspec>=1.1.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10.2",
    "uvicorn>=0.30",
    "watchdog>=6.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
